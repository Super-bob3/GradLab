<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>GradientLab — Free Mesh Gradient Generator</title>
    <meta name="description" content="Create stunning animated mesh gradients with GradientLab. Export as image, video, or standalone code. Free online gradient tool powered by OKLab color science.">
    <meta name="keywords" content="mesh gradient, gradient generator, animated gradient, gradient tool, OKLab, WebGL gradient, free gradient maker, CSS gradient, gradient background">
    <meta name="author" content="Superbobo">
    <link rel="canonical" href="https://www.gradlab.app">

    <!-- Open Graph (社交媒体分享) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.gradlab.app">
    <meta property="og:title" content="GradientLab — Free Mesh Gradient Generator">
    <meta property="og:description" content="Create stunning animated mesh gradients. Export as image, video, or standalone HTML code. Free and no sign-up required.">
    <meta property="og:image" content="https://www.gradlab.app/og-image.png">
    <meta property="og:site_name" content="GradientLab">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.gradlab.app">
    <meta name="twitter:title" content="GradientLab — Free Mesh Gradient Generator">
    <meta name="twitter:description" content="Create stunning animated mesh gradients. Export as image, video, or standalone HTML code.">
    <meta name="twitter:image" content="https://www.gradlab.app/og-image.png">

    <!-- Schema.org Structured Data (GEO + SEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "GradientLab",
      "url": "https://www.gradlab.app",
      "description": "Free online mesh gradient generator. Create stunning animated gradients with OKLab color science and export as image, video, or standalone HTML code.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Superbobo"
      },
      "featureList": [
        "Animated mesh gradient generation",
        "OKLab color blending",
        "Export as PNG image",
        "Export as MP4 video",
        "Export as standalone HTML code",
        "Multiple color themes",
        "Real-time preview",
        "Film grain effect",
        "Halftone effect",
        "ASCII matrix overlay"
      ],
      "screenshot": "https://www.gradlab.app/og-image.png",
      "isAccessibleForFree": true
    }
    </script>

    <!-- Instant theme flash prevention -->
    <script>
        (function () {
            try {
                var savedTheme  = localStorage.getItem('pipeline-shader-theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>

    <style>
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2');
            font-weight: 600; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/Geist-Bold.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist Mono';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist Mono';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/GeistMono-Medium.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css">
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body>

    <div class="layout">

    <!-- ── LEFT: CONTENT AREA ── -->
    <div class="content-area">

        <!-- TITLE BAR -->
        <div class="title-bar">
            <div class="title-left">
                <span class="title-name">GradLab</span>
            </div>
            <div class="title-actions">
                <button class="theme-toggle" id="btn-lang" title="切换语言 / Toggle Language"><i class="ri-translate-2"></i></button>
                <button class="theme-toggle" id="btn-theme" title="Toggle Theme"><i class="ri-sun-line"></i></button>
            </div>
        </div>

        <!-- CANVAS AREA -->
        <div class="canvas-area">
            <div class="card-container" id="cardContainer">
                <div class="card" id="shaderCard">
                    <canvas id="glCanvas"></canvas>
                    <canvas id="text-canvas"></canvas>
                    <canvas id="noise-canvas"></canvas>
                    <div class="pan-hud" id="panHud">X 0.000 &nbsp; Y 0.000</div>
                </div>
            </div>
        </div>

    </div><!-- /.content-area -->

    <!-- ── RIGHT: FLOATING PANEL ── -->
    <div class="panel-wrapper">
        <div class="panel">

        <!-- SECTION 1: PRESETS -->
        <div class="section-title">Color Themes</div>
        <div class="preset-group">
            <button class="preset-btn active" onclick="applyColorPreset('theme1', this)">Theme 1</button>
            <button class="preset-btn"        onclick="applyColorPreset('theme2', this)">Theme 2</button>
            <button class="preset-btn"        onclick="applyColorPreset('theme3', this)">Theme 3</button>
        </div>

        <!-- SECTION 2: PALETTE -->
        <div class="section-title">Palette</div>

        <div data-toggle="color-mode"></div>

        <label class="upload-area" id="palette-drop-zone" title="Click or Drag & Drop Image Here">
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <div class="upload-icon-badge"><i class="ri-image-add-line"></i></div>
            <div class="upload-title">Upload Image</div>
            <div class="upload-desc">Extract colors from any image</div>
        </label>

        <div id="color-list"></div>
        <button class="btn-ghost" id="btn-add-color" style="margin-top:8px;">+ Add Color</button>

        <!-- Blend Transition -->
        <div style="margin-top:14px;">
            <div data-slider="blend-bias"></div>
            <div data-slider="blend-sharp"></div>
        </div>

        <!-- SECTION 3: SHAPE & FLOW -->
        <div class="section-title">Shape &amp; Flow</div>

        <div data-select="type"></div>

        <label class="upload-area" id="bg-drop-zone" title="Upload an image to diffuse"
            style="display:none;margin-top:4px;">
            <input type="file" id="bg-upload" accept="image/*" style="display:none;">
            <div class="upload-icon-badge"><i class="ri-landscape-line"></i></div>
            <div class="upload-title">Upload Background</div>
            <div class="upload-desc">Diffuse an image into the gradient</div>
        </label>

        <div data-slider="zoom"></div>
        <div data-slider="speed"></div>
        <div data-slider="liquid"></div>

        <div id="wrapper-context-sliders" style="display:none;flex-direction:column;gap:8px;">
            <div data-slider="morph"></div>
            <div data-slider="rotation"></div>
        </div>

        <!-- SECTION 4: POST-PROCESSING -->
        <div class="section-title">Post-Processing</div>

        <div data-slider="grain"></div>
        <div data-select="grain-blend"></div>

        <!-- SECTION 5: HALFTONE EFFECT -->
        <div class="section-title">Halftone Effect</div>

        <div data-toggle="art-enable"></div>
        <div data-select="art-type"></div>
        <div data-slider="art-size"></div>
        <div data-select="art-shape"></div>
        <div data-slider="art-contrast"></div>

        <!-- SECTION 6: INTERACTIVE MATRIX -->
        <div class="section-title">Interactive Matrix</div>

        <div data-toggle="ascii-enable"></div>
        <div data-select="ascii-mode"></div>
        <div data-select="ascii-dither"></div>
        <div data-select="ascii-charset"></div>
        <div class="control-group control-group--text" id="group-custom-text" style="display:none;">
            <input type="text" id="ctrl-ascii-custom" value="ANTIGRAVITY">
        </div>

        <!-- Matrix Advanced (collapsible) -->
        <div>
            <button id="btn-matrix-advanced" class="btn-disclosure" onclick="toggleMatrixAdvanced()">
                <span>Advanced</span>
                <i id="matrix-adv-arrow" class="btn-disclosure-arrow ri-arrow-right-s-line"></i>
            </button>
            <div class="disclosure-body" id="matrix-advanced-group"><div class="disclosure-inner">
                <div data-slider="ascii-size"></div>
                <div data-slider="ascii-font"></div>
                <div data-slider="ascii-spacing"></div>
                <div data-colorpill="ascii-color"></div>
                <div data-select="ascii-blend"></div>
                <div data-slider="ascii-radius"></div>
                <div data-slider="ascii-smooth"></div>
                <div data-slider="ascii-gravity"></div>
                <div data-slider="ascii-decay"></div>
            </div></div>
        </div>

        <!-- EXPORT -->
        <div class="divider"></div>
        <button class="action-btn" id="btn-download">Download Frame</button>
        <div class="export-group" style="margin-top:6px;">
            <button class="action-btn" id="btn-record">⏺ Record MP4</button>
            <button class="action-btn" id="btn-export-code">⟨/⟩ Export Code</button>
        </div>
        <div data-toggle="pingpong" style="margin-top:8px;"></div>
        </div><!-- /.panel -->
    </div><!-- /.panel-wrapper -->

    </div><!-- /.layout -->

    <!-- ── CODE EXPORT MODAL ── -->
    <div class="modal-overlay" id="code-modal" style="display:none;">
        <div class="modal-box" style="width:90vw;max-width:900px;max-height:85vh;">
            <div class="modal-header">
                <span>Export Standalone Code</span>
                <button class="modal-close" id="btn-close-code">×</button>
            </div>
            <textarea class="code-textarea" id="code-output" readonly style="flex:1;min-height:200px;"></textarea>
            <div class="export-group">
                <button class="action-btn" id="btn-copy-code">Copy Code</button>
                <button class="action-btn" id="btn-download-code">Download Code</button>
                <button class="action-btn action-btn--ghost" id="btn-close-code2">Close</button>
            </div>
        </div>
    </div>
        </div>
    </div>

    <!-- ── COLOR PICKER MODAL ── -->
    <div class="modal-overlay" id="picker-modal">
        <div class="modal-box">
            <div class="modal-header">
                <span>Visual Color Picker</span>
                <button class="modal-close" id="btn-close-modal">×</button>
            </div>
            <div class="picker-container" id="picker-container">
                <canvas id="picker-canvas"></canvas>
            </div>
            <div class="modal-actions">
                <div class="modal-actions-left">
                    <button class="btn-mini" id="btn-picker-remove">- Color</button>
                    <button class="btn-mini" id="btn-picker-add">+ Color</button>
                </div>
                <button class="action-btn" id="btn-picker-done">Done</button>
            </div>
        </div>
    </div>

    <!-- ── ENTRY POINT ── -->
    <script type="module" src="src/main.js"></script>

</body>
</html>
