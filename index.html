    <!-- Instant theme flash prevention -->
    <script>
        (function () {
            try {
                var savedTheme  = localStorage.getItem('pipeline-shader-theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>

    <link rel="preload" href="src/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="src/fonts/remixicon.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('src/fonts/Geist-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('src/fonts/Geist-Medium.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('src/fonts/Geist-SemiBold.woff2') format('woff2');
            font-weight: 600; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('src/fonts/Geist-Bold.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist Mono';
            src: url('src/fonts/GeistMono-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Geist Mono';
            src: url('src/fonts/GeistMono-Medium.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }

    <link rel="stylesheet" href="src/fonts/remixicon.css">
    <link rel="stylesheet" href="src/styles.css">
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script defer src="/stats/script.js" data-website-id="839203e0-afe2-4fa4-b9dd-b2ae33061f2b" data-host-url="https://www.gradlab.app/stats"></script>
</head>

<body>

    <div class="layout">

    <!-- ── LEFT: CONTENT AREA ── -->
    <div class="content-area">

        <!-- TITLE BAR -->
        <div class="title-bar">
            <div class="title-left">
                <span class="title-name">GradLab</span>
            </div>
            <div class="title-actions">
                <a class="feedback-trigger" href="https://docs.gradlab.app/quickstart" target="_blank" rel="noopener">Docs⌝</a>
                <button class="feedback-trigger" id="btn-feedback">Feedback</button>
                <button class="theme-toggle" id="btn-lang" title="切换语言 / Toggle Language"><i class="ri-translate-2"></i></button>
                <button class="theme-toggle" id="btn-theme" title="Toggle Theme"><i class="ri-sun-line"></i></button>
            </div>
        </div>

        <!-- CANVAS AREA -->
        <div class="canvas-area">
            <div class="card-container" id="cardContainer">
                <div class="card" id="shaderCard">
                    <canvas id="glCanvas"></canvas>
                    <canvas id="text-canvas"></canvas>
                    <canvas id="noise-canvas"></canvas>
                    <div class="pan-hud" id="panHud">X 0.000 &nbsp; Y 0.000</div>
                </div>
            </div>
        </div>

    </div><!-- /.content-area -->

    <!-- Sheet overlay (mobile tap-to-close) -->
    <div class="sheet-overlay" id="sheetOverlay"></div>

    <!-- ── RIGHT: FLOATING PANEL ── -->
    <div class="panel-wrapper" id="panelWrapper">
        <div class="panel">
        <!-- Mobile drag handle -->
        <div class="sheet-handle" id="sheetHandle">
            <div class="sheet-handle-bar"></div>
        </div>

        <!-- SECTION 1: PRESETS -->
        <div class="preset-group">
            <button class="preset-btn active" onclick="applyColorPreset('theme1', this)">Theme 1</button>
            <button class="preset-btn"        onclick="applyColorPreset('theme2', this)">Theme 2</button>
            <button class="preset-btn"        onclick="applyColorPreset('theme3', this)">Theme 3</button>
        </div>

        <!-- CANVAS SIZE (desktop only) -->
        <div class="section-title" id="section-canvas-size">Canvas<span class="canvas-size-hint">Min 100px</span></div>
        <div class="canvas-size-row" id="group-canvas-size">
            <div class="canvas-size-field">
                <span class="canvas-size-label">W</span>
                <input type="number" id="ctrl-canvas-w" value="640" min="100" max="3840" inputmode="numeric" placeholder="Width">
            </div>
            <div class="canvas-size-field">
                <span class="canvas-size-label">H</span>
                <input type="number" id="ctrl-canvas-h" value="360" min="100" max="2160" inputmode="numeric" placeholder="Height">
            </div>
            <div class="canvas-size-presets">
                <button class="canvas-preset-btn active" data-w="640" data-h="360" title="Landscape 16:9"><i class="ri-rectangle-line"></i></button>
                <button class="canvas-preset-btn" data-w="480" data-h="480" title="Square 1:1"><i class="ri-square-line"></i></button>
            </div>
        </div>

        <label class="upload-area" id="palette-drop-zone" title="Click or Drag & Drop Image Here">
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <div class="upload-icon-badge"><i class="ri-image-add-line"></i></div>
            <div class="upload-title">Upload Image</div>
            <div class="upload-desc">Extract colors from any image</div>
        </label>

        <div data-toggle="color-mode"></div>

        <div id="color-list"></div>
        <button class="btn-line" id="btn-add-color">+ Add Color</button>

        <!-- Blend Transition -->
        <div id="blend-group">
            <div data-slider="blend-bias"></div>
            <div data-slider="blend-sharp"></div>
        </div>

        <!-- SECTION 3: SHAPE & FLOW -->
        <div class="section-title">Shape &amp; Flow</div>

        <div data-select="type"></div>

        <label class="upload-area" id="bg-drop-zone" title="Upload an image to diffuse"
            style="display:none;">
            <input type="file" id="bg-upload" accept="image/*" style="display:none;">
            <div class="upload-icon-badge"><i class="ri-landscape-line"></i></div>
            <div class="upload-title">Upload Background</div>
            <div class="upload-desc">Diffuse an image into the gradient</div>
        </label>

        <div data-slider="zoom"></div>
        <div data-slider="speed"></div>
        <div data-slider="liquid"></div>

        <div id="wrapper-context-sliders" style="display:none;">
            <div data-slider="morph"></div>
            <div data-slider="rotation"></div>
        </div>

        <!-- SECTION 4: POST-PROCESSING -->
        <div class="section-title">Post-Processing</div>

        <div data-slider="grain"></div>
        <div data-select="grain-blend"></div>

        <!-- SECTION 5: HALFTONE EFFECT -->
        <div class="section-title">Halftone Effect</div>

        <div data-toggle="art-enable"></div>
        <div data-select="art-type"></div>
        <div data-slider="art-size"></div>
        <div data-select="art-shape"></div>
        <div data-slider="art-contrast"></div>

        <!-- SECTION 6: INTERACTIVE MATRIX -->
        <div class="section-title">Interactive Matrix</div>

        <div data-toggle="ascii-enable"></div>
        <div data-select="ascii-mode"></div>
        <div data-select="ascii-dither"></div>
        <div data-select="ascii-charset"></div>
        <div class="canvas-size-field" id="group-custom-text" style="display:none;">
            <span class="canvas-size-label">Text</span>
            <input type="text" id="ctrl-ascii-custom" value="ANTIGRAVITY" placeholder="Enter characters…">
        </div>

        <!-- Matrix Advanced (collapsible) -->
        <div>
            <button id="btn-matrix-advanced" class="btn-disclosure" onclick="toggleMatrixAdvanced()">
                <span>Advanced</span>
                <i id="matrix-adv-arrow" class="btn-disclosure-arrow ri-arrow-right-s-line"></i>
            </button>
            <div class="disclosure-body" id="matrix-advanced-group"><div class="disclosure-inner">
                <div data-slider="ascii-size"></div>
                <div data-slider="ascii-font"></div>
                <div data-slider="ascii-spacing"></div>
                <div data-colorpill="ascii-color"></div>
                <div data-select="ascii-blend"></div>
                <div data-slider="ascii-radius"></div>
                <div data-slider="ascii-smooth"></div>
                <div data-slider="ascii-gravity"></div>
                <div data-slider="ascii-decay"></div>
            </div></div>
        </div>

        <!-- EXPORT -->
        <div class="divider"></div>
        <button class="action-btn" id="btn-download"><i class="ri-download-2-line"></i> Download Frame</button>
        <div class="export-group">
            <button class="action-btn" id="btn-record"><i class="ri-record-circle-line"></i> Record MP4</button>
            <button class="action-btn" id="btn-export-code"><i class="ri-code-s-slash-line"></i> Export Code</button>
        </div>
        <div data-toggle="pingpong"></div>
        </div><!-- /.panel -->
    </div><!-- /.panel-wrapper -->

    </div><!-- /.layout -->

    <!-- ── CODE EXPORT MODAL ── -->
    <div class="modal-overlay" id="code-modal" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-header-text">
                    <span class="modal-title">Export Code</span>
                    <span class="modal-description">Copy or download the standalone HTML file</span>
                </div>
                <button class="modal-close" id="btn-close-code"><i class="ri-close-line"></i></button>
            </div>
            <div class="modal-body">
                <textarea class="code-textarea" id="code-output" readonly></textarea>
            </div>
            <div class="modal-footer">
                <button class="action-btn action-btn--line" id="btn-close-code2"><i class="ri-qr-code-line"></i> Download Param Code</button>
                <button class="action-btn action-btn--line" id="btn-copy-code"><i class="ri-file-copy-line"></i> Copy Code</button>
                <button class="action-btn" id="btn-download-code"><i class="ri-download-2-line"></i> Download</button>
            </div>
        </div>
    </div>
        </div>
    </div>

    <!-- ── COLOR PICKER MODAL ── -->
    <div class="modal-overlay" id="picker-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-header-text">
                    <span class="modal-title">Extract Colors</span>
                    <span class="modal-description">Drag markers to sample colors from your image</span>
                </div>
                <button class="modal-close" id="btn-close-modal"><i class="ri-close-line"></i></button>
            </div>
            <div class="modal-body">
                <div class="picker-container" id="picker-container">
                    <canvas id="picker-canvas"></canvas>
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-left">
                    <button class="btn-mini" id="btn-picker-remove"><i class="ri-subtract-line"></i> Color</button>
                    <button class="btn-mini" id="btn-picker-add"><i class="ri-add-line"></i> Color</button>
                </div>
                <button class="action-btn" id="btn-picker-done">Done</button>
            </div>
        </div>
    </div>

    <!-- ── FEEDBACK POPOVER ── -->
    <div class="feedback-popover" id="feedback-popover" role="dialog" aria-label="Send feedback">
        <div class="feedback-normal">
            <div data-select="feedback-topic"></div>
            <div class="ds-textarea">
                <div class="ds-textarea__body">
                    <textarea class="ds-textarea__input" id="feedback-text" placeholder="Your feedback…" maxlength="2000"></textarea>
                </div>
            </div>
            <div class="feedback-footer">
                <button class="feedback-send" id="feedback-send" disabled>Send</button>
            </div>
        </div>
        <div class="feedback-success" hidden>
            <i class="ri-checkbox-circle-line"></i>
            <p>Thanks for your feedback!</p>
        </div>
    </div>

    <!-- ── ENTRY POINT ── -->
    <script type="module" src="src/main.js"></script>

</body>
</html>
